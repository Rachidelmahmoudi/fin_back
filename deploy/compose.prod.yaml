services:
  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env.prod
    depends_on: { db: { condition: service_healthy } }
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./jwt:/app/config/jwt:ro
      - uploads:/app/public/uploads
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env.prod
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
    depends_on: { db: { condition: service_healthy } }
    volumes: ["./jwt:/app/config/jwt:ro"]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finpharma
      POSTGRES_USER: finpharma
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpharma"]
      interval: 5s
      retries: 10
volumes: { caddy_data: {}, caddy_config: {}, pgdata: {}, uploads: {} }
